<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>服务器设置</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #1b1e20;
      --card: #232629;
      --border: #3b4045;
      --text: #eff0f1;
      --dim: #8a9599;
      --accent: #3daee9;
      --danger: #da4453;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 22px;
      background: var(--bg);
      color: var(--text);
      font-family: "Noto Sans", "Noto Sans CJK SC", "Microsoft YaHei", sans-serif;
      font-size: 13px;
    }
    h1 { font-size: 17px; margin: 0 0 4px; }
    p { color: var(--dim); margin: 0 0 16px; line-height: 1.6; }
    .card { background: var(--card); border: 1px solid var(--border); padding: 16px; }
    .mode { display: flex; gap: 18px; margin-bottom: 14px; }
    .mode label { display: flex; gap: 6px; align-items: center; cursor: pointer; }
    .field { display: flex; flex-direction: column; gap: 6px; margin-bottom: 12px; }
    .field span { color: var(--dim); font-size: 12px; }
    input[type="url"], input[type="text"] {
      background: var(--bg);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 9px 10px;
      font: inherit;
    }
    input:focus { outline: 1px solid var(--accent); border-color: var(--accent); }
    .buttons { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 14px; }
    button {
      background: #2a2e32;
      border: 1px solid var(--border);
      color: var(--text);
      padding: 8px 12px;
      font: inherit;
      cursor: pointer;
    }
    button.primary { background: var(--accent); border-color: var(--accent); color: #171a1c; }
    button:disabled { opacity: 0.5; cursor: default; }
    .status { margin-top: 12px; min-height: 20px; color: var(--dim); white-space: pre-wrap; }
    .status.ok { color: #27ae60; }
    .status.error { color: var(--danger); }
    .note { margin-top: 14px; font-size: 12px; color: var(--dim); line-height: 1.7; }
    code { background: var(--bg); border: 1px solid var(--border); padding: 1px 4px; }
  </style>
</head>
<body>
  <h1>服务器设置</h1>
  <p>本地模式使用内置服务端；远程模式连接已部署的计分板服务，由远程服务完成登录与鉴权。</p>
  <div class="card">
    <div class="mode">
      <label><input type="radio" name="mode" value="local" /> 本地模式（内置服务端）</label>
      <label><input type="radio" name="mode" value="remote" /> 远程模式（连接服务器）</label>
    </div>
    <div class="field">
      <span>远程服务器地址（远程模式必填）</span>
      <input id="remote-url" type="url" placeholder="https://score.example.com" spellcheck="false" />
    </div>
    <div class="buttons">
      <button id="test" type="button">测试连接</button>
      <button id="save" class="primary" type="button">保存并重启</button>
    </div>
    <div id="status" class="status"></div>
    <div class="note">
      非本机地址必须使用 HTTPS；应用不会保存账号或密码。自签证书需要先在系统中信任。<br />
      切换模式会重启应用；本地模式仅绑定 <code>127.0.0.1</code>。
    </div>
  </div>
  <script>
    const modeInputs = [...document.querySelectorAll('input[name="mode"]')];
    const urlInput = document.getElementById('remote-url');
    const statusEl = document.getElementById('status');
    const testBtn = document.getElementById('test');
    const saveBtn = document.getElementById('save');

    function setStatus(text, kind) {
      statusEl.textContent = text;
      statusEl.className = 'status' + (kind ? ' ' + kind : '');
    }
    function currentMode() {
      return modeInputs.find((input) => input.checked)?.value === 'remote' ? 'remote' : 'local';
    }
    function refreshDisabled() {
      urlInput.disabled = currentMode() === 'local';
    }
    modeInputs.forEach((input) => input.addEventListener('change', refreshDisabled));

    window.ssbConfig.get().then((config) => {
      modeInputs.forEach((input) => { input.checked = input.value === config.mode; });
      urlInput.value = config.remoteUrl || '';
      refreshDisabled();
    }).catch((error) => setStatus('读取配置失败：' + error.message, 'error'));

    testBtn.addEventListener('click', async () => {
      const url = urlInput.value.trim();
      if (!url) { setStatus('请输入服务器地址', 'error'); return; }
      testBtn.disabled = true;
      setStatus('正在连接…');
      try {
        const result = await window.ssbConfig.test(url);
        if (!result.ok) setStatus(result.error || '连接失败', 'error');
        else setStatus('连接成功：' + (result.version ? 'v' + result.version : result.url), 'ok');
      } catch (error) {
        setStatus('连接失败：' + error.message, 'error');
      } finally {
        testBtn.disabled = false;
      }
    });

    saveBtn.addEventListener('click', async () => {
      const mode = currentMode();
      const remoteUrl = urlInput.value.trim();
      if (mode === 'remote' && !remoteUrl) {
        setStatus('远程模式需要填写服务器地址', 'error');
        return;
      }
      saveBtn.disabled = true;
      setStatus('正在保存…');
      try {
        const result = await window.ssbConfig.save({ mode, remoteUrl });
        if (!result.ok) {
          setStatus(result.error || '保存失败', 'error');
          saveBtn.disabled = false;
          return;
        }
        setStatus('已保存，正在重启…', 'ok');
      } catch (error) {
        setStatus('保存失败：' + error.message, 'error');
        saveBtn.disabled = false;
      }
    });
  </script>
</body>
</html>
