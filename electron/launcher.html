<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>选择运行模式</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #1b1e20;
      --card: #232629;
      --border: #3b4045;
      --text: #eff0f1;
      --dim: #8a9599;
      --accent: #3daee9;
      --danger: #da4453;
      --input: #1b1e20;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 24px;
      background: var(--bg);
      color: var(--text);
      font-family: "Noto Sans", "Noto Sans CJK SC", "Microsoft YaHei", sans-serif;
      font-size: 13px;
      min-height: 100vh;
    }
    .brand { color: var(--accent); font-size: 12px; letter-spacing: 0.14em; text-transform: uppercase; }
    h1 { font-size: 19px; margin: 4px 0 6px; }
    .lead { color: var(--dim); margin: 0 0 18px; line-height: 1.7; }
    .modes { display: flex; gap: 8px; margin-bottom: 16px; }
    .mode-btn {
      flex: 1;
      background: var(--card);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 12px;
      text-align: left;
      cursor: pointer;
      font: inherit;
    }
    .mode-btn strong { display: block; font-size: 14px; margin-bottom: 4px; }
    .mode-btn span { color: var(--dim); font-size: 12px; line-height: 1.5; }
    .mode-btn.active { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
    .panel { background: var(--card); border: 1px solid var(--border); padding: 16px; }
    .panel[hidden] { display: none; }
    .field { display: flex; flex-direction: column; gap: 6px; margin-bottom: 12px; }
    .field span { color: var(--dim); font-size: 12px; }
    input {
      background: var(--input);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 9px 10px;
      font: inherit;
      width: 100%;
    }
    input:focus { outline: 1px solid var(--accent); border-color: var(--accent); }
    .buttons { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 14px; }
    button {
      background: #2a2e32;
      border: 1px solid var(--border);
      color: var(--text);
      padding: 9px 14px;
      font: inherit;
      cursor: pointer;
    }
    button.primary { background: var(--accent); border-color: var(--accent); color: #171a1c; }
    button.ghost { background: transparent; color: var(--dim); }
    button:disabled { opacity: 0.5; cursor: default; }
    .status { margin-top: 12px; min-height: 20px; color: var(--dim); white-space: pre-wrap; }
    .status.error { color: var(--danger); }
    .status.ok { color: #27ae60; }
    .note { margin-top: 14px; color: var(--dim); font-size: 12px; line-height: 1.7; }
    code { background: var(--input); border: 1px solid var(--border); padding: 1px 4px; }
  </style>
</head>
<body>
  <div class="brand">ScreenScoreBoard</div>
  <h1>选择运行模式</h1>
  <p class="lead">本地模式使用内置服务端；远程模式连接已部署的计分板，使用远程账号登录。</p>

  <div class="modes">
    <button class="mode-btn" id="mode-local" type="button">
      <strong>本地模式</strong>
      <span>内置服务端，仅本机，无需登录</span>
    </button>
    <button class="mode-btn" id="mode-remote" type="button">
      <strong>远程模式</strong>
      <span>连接远程服务器，需要账号密码</span>
    </button>
  </div>

  <section class="panel" id="panel-local" hidden>
    <p class="lead" style="margin-bottom: 0">
      使用内置服务端，数据保存在本机用户目录，管理端和显示端都无需登录。
    </p>
    <div class="buttons">
      <button class="primary" id="local-start" type="button">进入本地模式</button>
      <button class="ghost" id="local-quit" type="button">退出</button>
    </div>
    <div class="status" id="local-status"></div>
  </section>

  <section class="panel" id="panel-remote" hidden>
    <div class="field">
      <span>远程服务器地址（站点根地址，不要带 /admin）</span>
      <input id="remote-url" type="url" placeholder="https://score.example.com" spellcheck="false" />
    </div>
    <div class="field">
      <span>账号</span>
      <input id="remote-username" type="text" autocomplete="username" spellcheck="false" />
    </div>
    <div class="field">
      <span>密码</span>
      <input id="remote-password" type="password" autocomplete="current-password" />
    </div>
    <div class="field">
      <span>显示端网址（留空则使用服务器地址 + /display）</span>
      <input id="remote-display" type="url" placeholder="https://score.example.com/display" spellcheck="false" />
    </div>
    <div class="buttons">
      <button class="primary" id="remote-start" type="button">登录并连接</button>
      <button class="ghost" id="remote-quit" type="button">退出</button>
    </div>
    <div class="status" id="remote-status"></div>
    <div class="note">
      密码只用于本次登录，不会保存。远程管理端登录成功后，会话 Cookie 会保存在 Electron 的默认会话中。<br />
      非本机服务器必须使用 HTTPS；显示端网址可以是任意 http/https 页面，窗口会像无标签页浏览器一样打开它。
    </div>
  </section>

  <script>
    const state = { mode: 'local', busy: false, config: null };
    const modeLocal = document.getElementById('mode-local');
    const modeRemote = document.getElementById('mode-remote');
    const panelLocal = document.getElementById('panel-local');
    const panelRemote = document.getElementById('panel-remote');
    const remoteUrl = document.getElementById('remote-url');
    const remoteUsername = document.getElementById('remote-username');
    const remotePassword = document.getElementById('remote-password');
    const remoteDisplay = document.getElementById('remote-display');
    const localStatus = document.getElementById('local-status');
    const remoteStatus = document.getElementById('remote-status');
    const localStart = document.getElementById('local-start');
    const remoteStart = document.getElementById('remote-start');

    function setMode(mode) {
      state.mode = mode === 'remote' ? 'remote' : 'local';
      modeLocal.classList.toggle('active', state.mode === 'local');
      modeRemote.classList.toggle('active', state.mode === 'remote');
      panelLocal.hidden = state.mode !== 'local';
      panelRemote.hidden = state.mode !== 'remote';
      if (state.mode === 'remote') remoteUrl.focus();
    }

    function setStatus(el, text, kind) {
      el.textContent = text;
      el.className = 'status' + (kind ? ' ' + kind : '');
    }

    function setBusy(value) {
      state.busy = value;
      localStart.disabled = value;
      remoteStart.disabled = value;
      modeLocal.disabled = value;
      modeRemote.disabled = value;
    }

    modeLocal.addEventListener('click', () => setMode('local'));
    modeRemote.addEventListener('click', () => setMode('remote'));

    window.ssbLauncher.get().then((config) => {
      state.config = config || {};
      remoteUrl.value = config.remoteUrl || '';
      remoteUsername.value = config.username || '';
      remoteDisplay.value = config.displayUrl || '';
      setMode(config.mode === 'remote' ? 'remote' : 'local');
    }).catch((error) => {
      setStatus(remoteStatus, '读取配置失败：' + error.message, 'error');
    });

    localStart.addEventListener('click', async () => {
      if (state.busy) return;
      setBusy(true);
      setStatus(localStatus, '正在启动内置服务端…');
      try {
        const result = await window.ssbLauncher.local();
        if (!result.ok) {
          setStatus(localStatus, result.error || '启动失败', 'error');
          setBusy(false);
          return;
        }
        setStatus(localStatus, '已启动，正在进入…', 'ok');
      } catch (error) {
        setStatus(localStatus, '启动失败：' + error.message, 'error');
        setBusy(false);
      }
    });

    async function connectRemote() {
      if (state.busy) return;
      const config = {
        remoteUrl: remoteUrl.value.trim(),
        username: remoteUsername.value.trim(),
        password: remotePassword.value,
        displayUrl: remoteDisplay.value.trim(),
      };
      if (!config.remoteUrl) { setStatus(remoteStatus, '请填写远程服务器地址', 'error'); return; }
      if (!config.username) { setStatus(remoteStatus, '请填写账号', 'error'); return; }
      if (!config.password) { setStatus(remoteStatus, '请填写密码', 'error'); return; }
      setBusy(true);
      setStatus(remoteStatus, '正在连接并登录…');
      try {
        const result = await window.ssbLauncher.remote(config);
        if (!result.ok) {
          setStatus(remoteStatus, result.error || '连接失败', 'error');
          setBusy(false);
          return;
        }
        remotePassword.value = '';
        setStatus(remoteStatus, '登录成功，正在进入…', 'ok');
      } catch (error) {
        setStatus(remoteStatus, '连接失败：' + error.message, 'error');
        setBusy(false);
      }
    }

    remoteStart.addEventListener('click', () => { void connectRemote(); });
    remotePassword.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') { e.preventDefault(); void connectRemote(); }
    });
    document.getElementById('local-quit').addEventListener('click', () => window.ssbLauncher.quit());
    document.getElementById('remote-quit').addEventListener('click', () => window.ssbLauncher.quit());
  </script>
</body>
</html>
