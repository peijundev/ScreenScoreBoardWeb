apiVersion: apps/v1
kind: Deployment
metadata:
  name: screenscoreboard
  labels:
    app.kubernetes.io/name: screenscoreboard
spec:
  # 必须是单副本：服务端有内存状态与 WebSocket 广播，多副本会各自维护一份状态
  replicas: 1
  # 数据卷是 ReadWriteOnce，且旧副本退出前新副本不应启动
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: screenscoreboard
  template:
    metadata:
      labels:
        app.kubernetes.io/name: screenscoreboard
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        # 让 PVC 以 node(1000) 可写的属组挂载
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: scoreboard
          image: ghcr.io/peijundev/screenscoreboard:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3000
          envFrom:
            - configMapRef:
                name: screenscoreboard-config
            - secretRef:
                name: screenscoreboard-auth
          volumeMounts:
            - name: data
              mountPath: /data
            - name: tmp
              mountPath: /tmp
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: screenscoreboard-data
        - name: tmp
          emptyDir: {}
      terminationGracePeriodSeconds: 30
