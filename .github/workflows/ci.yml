name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    name: Typecheck & Verify
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: scoreboard
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      mysql:
        image: mysql:8
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: scoreboard
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      mongo:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand({ping:1})'"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      TEST_PG_URL: postgres://postgres:postgres@127.0.0.1:5432/scoreboard
      TEST_MYSQL_URL: mysql://root:root@127.0.0.1:3306/scoreboard
      TEST_MONGO_URL: mongodb://127.0.0.1:27017/scoreboard
      TEST_REDIS_URL: redis://127.0.0.1:6379/0
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Frontend typecheck
        run: npm run typecheck

      - name: Backend typecheck
        run: npm run typecheck:server

      # 依赖 Node 24 原生 TypeScript 类型剥离，直接加载 .ts 源码
      - name: Theme tests
        run: npm run test:theme

      - name: Generated contracts are up to date
        run: |
          npm run gen:contracts
          git diff --exit-code -- web/src/shared/settings.generated.ts web/src/shared/ops.generated.ts

      - name: Storage tests
        run: npm run test:storage

      - name: End-to-end verify
        run: npm run verify

      - name: REST v1 tests
        run: npm run test:api

      - name: MCP tests
        run: npm run test:mcp

      - name: Auth tests
        run: npm run test:auth

      - name: SDK build & tests
        run: npm run sdk:test
