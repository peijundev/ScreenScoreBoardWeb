services:
  scoreboard:
    build: .
    image: screenscoreboard:local
    container_name: screen-scoreboard
    init: true
    ports:
      - "3000:3000"
    environment:
      # 存储后端：json（默认）/ txt / sqlite / postgres / mysql / mongodb / sqlserver / oracle / redis / libsql / couchdb / d1 / dynamodb / firestore / s3 / etcd / lmdb
      # 也可在管理端「存储后端」保存到 /data/storage.json；该文件优先于这里的环境变量
      STORAGE: ${STORAGE:-json}
      TZ: ${TZ:-Asia/Shanghai}
      BACKUP_INTERVAL_MINUTES: "30"
      BACKUP_KEEP: "20"
      # 首次启动必须设置管理员密码；之后修改无效（用 npm run auth:reset）
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      ADMIN_PASSWORD_FILE: ${ADMIN_PASSWORD_FILE:-}
      SESSION_TTL_HOURS: ${SESSION_TTL_HOURS:-24}
      SESSION_REMEMBER_DAYS: ${SESSION_REMEMBER_DAYS:-30}
      COOKIE_SECURE: ${COOKIE_SECURE:-auto}
      TRUST_PROXY: ${TRUST_PROXY:-0}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-}
      # 使用 PostgreSQL 时：
      # STORAGE=postgres DATABASE_URL=postgres://scoreboard:password@db:5432/scoreboard
      DATABASE_URL: ${DATABASE_URL:-}
      # Node 内置 HTTPS（可选；证书需要额外挂载到容器内）
      # TLS_CERT_FILE: /certs/fullchain.pem
      # TLS_KEY_FILE: /certs/privkey.pem
      # 使用 SQLite 时：
      # SQLITE_FILE: /data/scoreboard.db
      # 使用 MongoDB / Redis 时：
      # MONGODB_URL: mongodb://mongo:27017/scoreboard
      # REDIS_URL: redis://redis:6379/0
      # 使用 SQL Server / Oracle 时：MSSQL_URL / ORACLE_URL（见 docs/storage-backends.md）
    volumes:
      # Docker Rootless 或无法使用 bind mount 时，叠加 docker-compose.rootless.yml 改用命名卷
      - ./data:/data
    restart: unless-stopped
    # 加固：根文件系统只读，只有 /data 与 /tmp 可写
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:'+(process.env.PORT||3000)+'/api/health').then(r=>r.json()).then(j=>process.exit(j.ok?0:1)).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    depends_on:
      db:
        condition: service_healthy
        required: false
      mongo:
        condition: service_healthy
        required: false
      redis:
        condition: service_healthy
        required: false

  # PostgreSQL（可选）：docker compose --profile postgres up -d
  # 同时把 STORAGE=postgres 与 DATABASE_URL 传给 scoreboard
  db:
    image: postgres:17-alpine
    profiles: ["postgres"]
    container_name: screen-scoreboard-db
    environment:
      POSTGRES_DB: scoreboard
      POSTGRES_USER: scoreboard
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-scoreboard}
      TZ: ${TZ:-Asia/Shanghai}
    volumes:
      - ./pgdata:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U scoreboard -d scoreboard"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  # MongoDB（可选）：docker compose --profile mongo up -d
  mongo:
    image: mongo:7
    profiles: ["mongo"]
    container_name: screen-scoreboard-mongo
    volumes:
      - ./mongodata:/data/db
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand({ping:1})"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  # Redis（可选）：docker compose --profile redis up -d
  # 作为权威存储必须开启 AOF 与 noeviction，否则重启/淘汰可能丢状态
  redis:
    image: redis:7-alpine
    profiles: ["redis"]
    container_name: screen-scoreboard-redis
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --appendfsync
      - everysec
      - --maxmemory-policy
      - noeviction
    volumes:
      - ./redisdata:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
