<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>计分板</title>
  <link rel="stylesheet" href="/display.css">
</head>
<body data-theme="dark" data-density="comfortable">
  <header class="topbar">
    <h1 id="board-title">计分板</h1>
    <span class="edit-hint">拖动卡片移动位置，右下角调整大小</span>
    <span id="conn-dot" class="dot connecting" title="连接状态"></span>
  </header>
  <div id="clock" class="overlay-clock hidden"></div>
  <div id="countdown" class="overlay-countdown hidden"></div>
  <div id="countdown-big" class="countdown-big hidden">
    <div class="ink-scene" aria-hidden="true">
      <div class="ink-art"><div id="countdown-ink-time" class="ink-number">05:00</div></div>
      <div class="ink-petals"></div>
    </div>
    <video id="countdown-video" class="countdown-video" muted playsinline preload="auto"
      src="/media/ink-countdown.mp4"></video>
    <div id="countdown-video-time" class="countdown-video-time hidden"></div>
    <div class="countdown-stage">
      <div class="countdown-ring">
        <div id="countdown-big-time" class="countdown-time">05:00</div>
      </div>
      <div id="countdown-big-caption" class="countdown-caption">倒计时</div>
    </div>
  </div>
  <div id="marquee" class="marquee hidden"><span id="marquee-text"></span></div>
  <audio id="bgm" loop preload="auto"></audio>
  <main id="board" class="board"></main>
  <main id="leaderboard" class="leaderboard hidden"></main>
  <main id="welcome" class="welcome hidden">
    <div id="welcome-text" class="welcome-text"></div>
  </main>
  <div id="empty-tip" class="empty-tip">暂无数据，请在管理端添加人员</div>
  <script src="/shared.js"></script>
  <script src="/display.js"></script>
</body>
</html>
