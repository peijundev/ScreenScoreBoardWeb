<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>管理控制台 · 计分板</title>
  <link rel="stylesheet" href="/admin.css">
</head>
<body data-theme="dark">
  <header class="topbar">
    <h1>管理控制台</h1>
    <select id="project-select" class="project-select" title="切换项目"></select>
    <button id="project-add" class="btn small" type="button">新建项目</button>
    <button id="project-rename" class="btn small" type="button">重命名</button>
    <button id="project-delete" class="btn small danger" type="button">删除项目</button>
    <button id="settings-open" class="btn small" type="button">排版设置</button>
    <span id="conn-dot" class="dot connecting" title="连接状态"></span>
    <!--suppress HtmlUnknownTarget -->
    <a class="open-display" href="/display" target="_blank">打开显示端</a>
  </header>
  <div id="toast" class="toast hidden"></div>

  <main class="panels">
    <!-- 显示端预览 -->
    <section class="panel preview-panel">
      <div class="panel-head">
        <h2>显示端预览</h2>
        <div class="preview-tools">
          <select id="preview-resolution" class="preview-resolution" title="预览画布分辨率">
            <option value="auto">自适应</option>
            <option value="1920x1080">1920 × 1080</option>
            <option value="2560x1440">2560 × 1440</option>
            <option value="3840x2160">3840 × 2160</option>
          </select>
          <button id="preview-out" class="btn small" type="button" title="缩小预览">−</button>
          <span id="preview-zoom-label">100%</span>
          <button id="preview-in" class="btn small" type="button" title="放大预览">+</button>
          <button id="preview-reset" class="btn small" type="button">重置</button>
        </div>
      </div>

      <!-- 常用排版快速调节 -->
      <div class="preview-quickbar">
        <label>风格
          <select id="quick-style">
            <option value="lecture">大屏讲演</option>
            <option value="ppt">PPT 演示</option>
            <option value="seewo">希沃白板</option>
            <option value="kde">KDE 桌面</option>
            <option value="guofeng">古风雅集</option>
            <option value="ink">水墨</option>
            <option value="modern">现代极简</option>
            <option value="neon">赛博霓虹</option>
            <option value="poster">海报展板</option>
            <option value="custom">自由配置</option>
          </select>
        </label>
        <label>主题
          <select id="quick-theme">
            <option value="dark">深色</option>
            <option value="light">浅色</option>
          </select>
        </label>
        <label>列数 <span id="quick-columns-val">4</span>
          <input id="quick-columns" type="range" min="1" max="8" step="1">
        </label>
        <label>密度
          <select id="quick-density">
            <option value="comfortable">舒适</option>
            <option value="compact">紧凑</option>
          </select>
        </label>
        <label>排序
          <select id="quick-sort">
            <option value="score_desc">分数从高到低</option>
            <option value="score_asc">分数从低到高</option>
            <option value="created_asc">添加顺序（旧→新）</option>
            <option value="created_desc">添加顺序（新→旧）</option>
          </select>
        </label>
        <label>强调色
          <input id="quick-accent" type="color">
        </label>
        <label class="check">
          <input id="quick-edit" type="checkbox"> 编辑布局
        </label>
      </div>

      <p class="preview-hint">默认与显示端 1:1 复刻（不含编辑控件）；勾选「编辑布局」后可拖动卡片、拉右下角调整大小；开启「标题自由位置」后可直接在预览里拖动标题。预览窗口可拖动设置面板，边看边调。</p>
      <div class="preview-frame-wrap" id="preview-wrap">
        <div class="preview-stage" id="preview-stage">
          <iframe id="display-preview" src="/display" title="显示端预览"></iframe>
        </div>
      </div>
    </section>

    <!-- 人员面板 -->
    <section class="panel">
      <h2>人员</h2>
      <form id="add-person-form" class="add-form">
        <img id="person-avatar-preview" class="avatar-preview" alt="头像预览">
        <input id="person-name" type="text" maxlength="20" placeholder="姓名" aria-label="姓名" required>
        <label class="file-btn">
          选择头像
          <input id="person-avatar" type="file" accept="image/png,image/jpeg,image/webp,image/gif" hidden>
        </label>
        <button type="submit" class="btn primary">添加</button>
      </form>
      <div id="people-list" class="people-list"></div>
    </section>

    <!-- 团队面板 -->
    <section class="panel">
      <h2>团队</h2>
      <form id="add-team-form" class="add-form">
        <img id="team-avatar-preview" class="avatar-preview" alt="头像预览">
        <input id="team-name" type="text" maxlength="20" placeholder="团队名" aria-label="团队名" required>
        <label class="file-btn">
          选择头像
          <input id="team-avatar" type="file" accept="image/png,image/jpeg,image/webp,image/gif" hidden>
        </label>
        <button type="submit" class="btn primary">创建</button>
      </form>
      <div id="teams-list" class="teams-list"></div>
    </section>

  </main>

  <!-- 排版设置弹窗 -->
  <dialog id="settings-dialog" class="settings-dialog">
    <header class="dialog-header">
      <h2>排版设置</h2>
      <button id="settings-close" class="btn small" type="button">关闭</button>
    </header>
      <div class="settings-form">
        <div class="set-group">
          <h3>内容</h3>
          <label>标题文字
            <input id="set-title" type="text" maxlength="30">
          </label>
          <label class="check">
            <input id="set-show-member-score" type="checkbox"> 显示成员分数
          </label>
          <label class="check">
            <input id="set-show-team-total" type="checkbox"> 显示团队总分
          </label>
        </div>

        <div class="set-group">
          <h3>版式</h3>
          <label>显示风格
            <select id="set-display-style">
              <option value="lecture">大屏讲演</option>
              <option value="ppt">PPT 演示</option>
              <option value="seewo">希沃白板</option>
              <option value="kde">KDE 桌面</option>
              <option value="guofeng">古风雅集</option>
              <option value="ink">水墨</option>
              <option value="modern">现代极简</option>
              <option value="neon">赛博霓虹</option>
              <option value="poster">海报展板</option>
              <option value="custom">自由配置</option>
            </select>
          </label>
          <label>标题对齐
            <select id="set-title-align">
              <option value="auto">跟随风格</option>
              <option value="center">居中</option>
              <option value="left">居左</option>
              <option value="right">居右</option>
            </select>
          </label>
          <label class="check">
            <input id="set-title-free" type="checkbox"> 标题自由位置（在预览中拖动）
          </label>
          <button id="reset-title-pos" class="btn small" type="button">重置标题位置</button>
          <label class="check">
            <input id="set-style-free" type="checkbox"> 风格自由配置（覆盖风格的固定排版）
          </label>
          <label>每行列数 <span id="columns-val">4</span>
            <input id="set-columns" type="range" min="1" max="8" step="1">
          </label>
          <label>卡片密度
            <select id="set-density">
              <option value="comfortable">舒适</option>
              <option value="compact">紧凑</option>
            </select>
          </label>
          <label>排序方式
            <select id="set-sortby">
              <option value="score">按分数</option>
              <option value="created">按添加顺序</option>
            </select>
          </label>
          <label>排序方向
            <select id="set-sortorder">
              <option value="desc">从高到低 / 从先到后</option>
              <option value="asc">从低到高 / 从后到先</option>
            </select>
          </label>
          <label>主题
            <select id="set-theme">
              <option value="dark">深色</option>
              <option value="light">浅色</option>
            </select>
          </label>
          <label class="check">
            <input id="set-layout-mode" type="checkbox"> 自由布局（在预览中拖动卡片）
          </label>
          <button id="reset-layout" class="btn small" type="button">重置卡片位置</button>
        </div>

        <div class="set-group">
          <h3>背景</h3>
          <div class="seg">
            <label class="seg-item"><input type="radio" name="bg-type" value="color" checked> 纯色</label>
            <label class="seg-item"><input type="radio" name="bg-type" value="image"> 图片</label>
          </div>
          <label class="check">
            <input id="set-bg-color-enabled" type="checkbox"> 自定义背景色
          </label>
          <label>背景色
            <input id="set-bg-color" type="color" disabled>
          </label>
          <div class="bg-image-row" id="bg-image-row">
            <label class="file-btn">
              选择背景图
              <input id="set-bg-image" type="file" accept="image/png,image/jpeg,image/webp,image/gif" hidden>
            </label>
            <button id="set-bg-image-clear" class="btn small" type="button">移除图片</button>
          </div>
          <img id="bg-image-preview" class="bg-image-preview hidden" alt="背景预览">
        </div>

        <div class="set-group">
          <h3>卡片</h3>
          <label>卡片样式
            <select id="set-card-style">
              <option value="solid">普通</option>
              <option value="glass">毛玻璃</option>
              <option value="neumorph">新拟态</option>
              <option value="neon">霓虹描边</option>
              <option value="gradient">渐变</option>
              <option value="paper">纸片</option>
            </select>
          </label>
          <label>强调色
            <input id="set-accent" type="color">
          </label>
          <label>卡片底色
            <select id="set-card-bg-mode">
              <option value="auto">跟随主题</option>
              <option value="custom">自定义纯色</option>
              <option value="translucent">半透明</option>
              <option value="acrylic">亚克力</option>
            </select>
          </label>
          <label>底色颜色
            <input id="set-card-bg" type="color">
          </label>
          <label>卡片不透明度 <span id="card-opacity-val">55</span>%
            <input id="set-card-opacity" type="range" min="0.15" max="1" step="0.05">
          </label>
          <label>亚克力模糊 <span id="card-blur-val">12</span> px
            <input id="set-card-acrylic-blur" type="range" min="0" max="40" step="1">
          </label>
          <label>卡片圆角 <span id="radius-val">10</span> px
            <input id="set-card-radius" type="range" min="0" max="32" step="1">
          </label>
          <label>成员卡片大小 <span id="member-scale-val">1.0</span> 倍
            <input id="set-member-scale" type="range" min="0.6" max="2" step="0.05">
          </label>
          <label>头像位置
            <select id="set-avatar-position">
              <option value="left">头像在姓名左侧</option>
              <option value="right">头像在姓名右侧</option>
              <option value="top">头像在姓名上方</option>
              <option value="bottom">头像在姓名下方</option>
            </select>
          </label>
          <label class="check">
            <input id="set-avatar-auto" type="checkbox"> 头像随卡片自适应
          </label>
          <label>头像大小 <span id="avatar-size-val">64</span> px
            <input id="set-avatar-size" type="range" min="24" max="160" step="1" disabled>
          </label>
        </div>

        <div class="set-group advanced">
          <h3>高级外观</h3>
          <label>字体
            <select id="set-font-family">
              <option value="system">系统黑体</option>
              <option value="serif">宋体 / 衬线</option>
              <option value="kai">楷体</option>
            </select>
          </label>
          <label>字号缩放 <span id="font-scale-val">1</span> 倍
            <input id="set-font-scale" type="range" min="0.7" max="1.5" step="0.05">
          </label>
          <label>标题字号 <span id="title-size-val">自动</span>
            <input id="set-title-size" type="range" min="0" max="120" step="2">
          </label>
          <label>标题装饰
            <select id="set-title-decor">
              <option value="auto">跟随风格</option>
              <option value="plain">纯标题（去掉胶囊/竖条/标题栏底色）</option>
            </select>
          </label>
          <label class="check">
            <input id="set-title-rule" type="checkbox"> 显示标题横线
          </label>
          <label class="check">
            <input id="set-title-color-enabled" type="checkbox"> 自定义标题颜色
          </label>
          <label>标题颜色
            <input id="set-title-color" type="color" disabled>
          </label>
          <label>页面最大宽度 <span id="board-max-val">1800</span> px
            <input id="set-board-max" type="range" min="900" max="2600" step="20">
          </label>
          <label>卡片间距 <span id="card-gap-val">自动</span>
            <input id="set-card-gap" type="range" min="0" max="60" step="1">
          </label>
          <label>卡片内边距 <span id="card-pad-val">自动</span>
            <input id="set-card-pad" type="range" min="0" max="60" step="1">
          </label>
          <label>卡片边框宽度 <span id="card-border-width-val">1</span> px
            <input id="set-card-border-width" type="range" min="0" max="6" step="1">
          </label>
          <label class="check">
            <input id="set-card-border-color-enabled" type="checkbox"> 自定义边框颜色
          </label>
          <label>边框颜色
            <input id="set-card-border-color" type="color" disabled>
          </label>
          <label>卡片阴影
            <select id="set-card-shadow">
              <option value="auto">跟随样式</option>
              <option value="none">无</option>
              <option value="soft">轻</option>
              <option value="medium">中</option>
              <option value="strong">强</option>
            </select>
          </label>
          <label>团队色条宽度 <span id="team-bar-val">4</span> px
            <input id="set-team-bar-width" type="range" min="0" max="12" step="1">
          </label>
          <label class="check">
            <input id="set-show-team-accent" type="checkbox"> 显示团队色条
          </label>
          <label class="check">
            <input id="set-team-accent-color-enabled" type="checkbox"> 自定义团队色条颜色
          </label>
          <label>团队色条颜色
            <input id="set-team-accent-color" type="color" disabled>
          </label>
          <label>头像边框宽度 <span id="avatar-border-val">1</span> px
            <input id="set-avatar-border-width" type="range" min="0" max="6" step="1">
          </label>
          <label>头像形状
            <select id="set-avatar-shape">
              <option value="circle">圆形</option>
              <option value="square">方形</option>
            </select>
          </label>
          <label class="check">
            <input id="set-text-color-enabled" type="checkbox"> 自定义文字颜色
          </label>
          <label>文字颜色
            <input id="set-text-color" type="color" disabled>
          </label>
          <label>正分颜色
            <input id="set-positive-color" type="color">
          </label>
          <label>负分颜色
            <input id="set-negative-color" type="color">
          </label>
          <label class="check">
            <input id="set-rank-color-enabled" type="checkbox"> 自定义名次颜色
          </label>
          <label>名次颜色
            <input id="set-rank-color" type="color" disabled>
          </label>
          <label>背景压暗 <span id="scrim-opacity-val">100</span>%
            <input id="set-scrim-opacity" type="range" min="0" max="1" step="0.05">
          </label>
          <label class="check">
            <input id="set-show-rank" type="checkbox"> 显示名次角标
          </label>
          <label>名次字号 <span id="rank-size-val">15</span> px
            <input id="set-rank-size" type="range" min="10" max="40" step="1">
          </label>
          <label class="check">
            <input id="set-show-score-bar" type="checkbox"> 显示分数比例条
          </label>
          <label>比例条高度 <span id="score-bar-height-val">5</span> px
            <input id="set-score-bar-height" type="range" min="0" max="16" step="1">
          </label>
        </div>

        <div class="set-group">
          <h3>特效</h3>
          <label>毛玻璃模糊 <span id="glass-blur-val">12</span> px
            <input id="set-glass-blur" type="range" min="0" max="40" step="1">
          </label>
          <label>毛玻璃透明度 <span id="glass-opacity-val">55</span>%
            <input id="set-glass-opacity" type="range" min="0.15" max="0.95" step="0.05">
          </label>
          <label>记分特效
            <select id="set-score-effect">
              <option value="bounce">弹跳放大</option>
              <option value="glow">发光</option>
              <option value="float">飘浮数字</option>
              <option value="shake">抖动</option>
              <option value="confetti">彩带</option>
              <option value="spotlight">居中放大突显</option>
              <option value="none">关闭</option>
            </select>
          </label>
          <label>突显范围（居中放大时）
            <select id="set-spotlight-scope">
              <option value="team">仅团队</option>
              <option value="person_team">人物 + 团队</option>
              <option value="person">仅人物</option>
            </select>
          </label>
          <label>突显宽度 <span id="spotlight-width-val">520</span> px
            <input id="set-spotlight-width" type="range" min="200" max="1600" step="20">
          </label>
          <label>突显高度 <span id="spotlight-height-val">自动</span>
            <input id="set-spotlight-height" type="range" min="0" max="1200" step="20">
          </label>
          <button id="preview-spotlight" class="btn small" type="button">预览突显效果</button>
          <label>特效时长 <span id="fx-duration-val">700</span> ms
            <input id="set-fx-duration" type="range" min="200" max="3000" step="50">
          </label>
          <label class="check">
            <input id="set-fx-only-positive" type="checkbox"> 仅加分时触发特效/声音
          </label>
          <label class="check">
            <input id="set-fx-color-enabled" type="checkbox"> 自定义特效颜色
          </label>
          <label>特效颜色
            <input id="set-fx-color" type="color" disabled>
          </label>
          <label class="check">
            <input id="set-sound" type="checkbox"> 记分音效（在显示端点一下页面即可解锁声音）
          </label>
          <label>音效音量 <span id="sound-volume-val">50</span>%
            <input id="set-sound-volume" type="range" min="0" max="1" step="0.05">
          </label>
          <div class="sound-row">
            <label class="file-btn">
              自定义音效
              <input id="set-custom-sound" type="file" accept="audio/wav,audio/ogg,audio/mpeg,audio/mp4,.wav,.ogg,.mp3,.m4a" hidden>
            </label>
            <span id="custom-sound-name" class="hint">未设置（内置合成音）</span>
            <button id="clear-custom-sound" class="btn small" type="button">清除</button>
          </div>
        </div>
      </div>
  </dialog>

  <script src="/shared.js"></script>
  <script src="/admin.js"></script>
</body>
</html>
